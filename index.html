<style>
:root{
  --primary:#e23670;
  --primary-dark:#c22a5d;
  --gold:#c98a3e;
  --blue:#3b82f6;
  --green:#22c55e;
  --orange:#f59e0b;
  --bg:#f4f4f6;
  --text:#181818;
  --muted:#6b7280;
  --border:#e6e6e9;
  --radius:14px;
  --maxw:520px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Poppins',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);}
#app{max-width:var(--maxw);margin:0 auto;min-height:100vh;background:#fff;box-shadow:0 0 40px rgba(0,0,0,.05);display:flex;flex-direction:column;position:relative;}
header{position:sticky;top:0;background:#fff;z-index:10;border-bottom:1px solid var(--border);}
.logo-row{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 0 12px;}
.logo-img{height:26px;}
.logo-fallback{display:flex;flex-direction:column;align-items:center;line-height:1;}
.logo-main{font-weight:700;font-size:20px;color:var(--primary);letter-spacing:.5px;}
.logo-sub{font-weight:600;font-size:10px;color:var(--primary);letter-spacing:3px;margin-top:3px;}
main{flex:1;padding:20px 20px 90px;animation:fade .2s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
h1.page-title{font-size:22px;font-weight:700;margin:0 0 2px;}
.page-sub{color:var(--muted);font-size:13px;margin:0 0 18px;}
.btn-primary{display:block;width:100%;background:var(--primary);color:#fff;border:none;border-radius:30px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;}
.btn-secondary{display:block;width:100%;background:#f7f7f8;color:var(--text);border:1px solid var(--border);border-radius:30px;padding:14px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;text-align:center;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text);}
.field input,.field select{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:12px;font-size:15px;font-family:inherit;background:#fbfbfc;}
.field input:focus,.field select:focus{outline:2px solid var(--primary);}
.error-box{background:#fdecec;border:1px solid #f6c6c6;color:#c0392b;border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:14px;}
.center-screen{min-height:calc(100vh - 60px);display:flex;flex-direction:column;justify-content:center;}
.hero-icon{font-size:40px;text-align:center;margin-bottom:10px;}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;}
.greeting{font-size:14px;color:var(--muted);margin-bottom:2px;}
.greeting-name{font-size:22px;font-weight:700;margin-bottom:14px;}
.motiv-banner{background:#fdeef2;color:var(--primary-dark);border-radius:12px;padding:12px 14px;font-size:13.5px;font-weight:600;margin-bottom:16px;}
.progress-card{display:flex;align-items:center;gap:16px;}
.ring{width:64px;height:64px;flex-shrink:0;}
.progress-card .info{flex:1;}
.progress-card .info h3{margin:0;font-size:16px;}
.progress-card .info p{margin:2px 0 8px;color:var(--muted);font-size:12.5px;}
.bar-outer{height:8px;background:#eee;border-radius:6px;overflow:hidden;}
.bar-fill{height:100%;background:var(--primary);}
.today-card{border-radius:var(--radius);padding:18px;color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-dark));margin-bottom:14px;}
.today-card .eyebrow{font-size:11px;opacity:.85;text-transform:uppercase;letter-spacing:.5px;font-weight:700;}
.today-card h3{margin:6px 0 2px;font-size:18px;}
.today-card p{margin:0 0 12px;font-size:13px;opacity:.9;}
.today-meta{display:flex;gap:16px;font-size:12.5px;opacity:.95;margin-bottom:12px;}
.today-card .btn-primary{background:#fff;color:var(--primary-dark);}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.stat-box{border-radius:12px;padding:14px;color:#fff;}
.stat-box .lbl{font-size:10.5px;text-transform:uppercase;font-weight:700;opacity:.85;}
.stat-box .val{font-size:24px;font-weight:800;margin-top:4px;}
.stat-box .sub{font-size:11px;opacity:.85;}
.shortcut{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;}
.shortcut .icon{width:38px;height:38px;border-radius:10px;background:#fdeef2;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.shortcut .txt{flex:1;}
.shortcut .txt h4{margin:0;font-size:14.5px;}
.shortcut .txt p{margin:2px 0 0;font-size:12px;color:var(--muted);}
.shortcut .arrow{color:#c1c1c6;}
.back-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;cursor:pointer;}
.back-row .icon{font-size:18px;}
.back-row .titles h1{margin:0;font-size:19px;}
.back-row .titles p{margin:0;font-size:12px;color:var(--muted);}
.week-block{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
.week-head{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;background:#fbfbfc;}
.week-num{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
.week-head .info{flex:1;}
.week-head .info h4{margin:0;font-size:14.5px;}
.week-head .info p{margin:1px 0 0;font-size:11.5px;color:var(--muted);}
.week-body{padding:10px;display:none;}
.week-body.open{display:block;}
.day-row{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.day-row.done{background:#eefbf1;border-color:#bfe8c9;}
.day-row.current{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary);}
.day-row .eyebrow{font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:700;}
.day-row h5{margin:2px 0 4px;font-size:14.5px;}
.day-row .meta{font-size:11.5px;color:var(--muted);}
.pill-btn{border:none;border-radius:20px;padding:8px 14px;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;flex-shrink:0;white-space:nowrap;}
.pill-btn.primary{background:var(--primary);color:#fff;}
.pill-btn.ghost{background:#f0f0f2;color:var(--text);}
.pill-btn.disabled{background:#f0f0f2;color:#c1c1c6;cursor:not-allowed;}
.tip-box{background:#fdf3e7;border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:16px;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.chip{padding:9px 14px;border-radius:20px;border:1px solid var(--border);background:#f7f7f8;font-size:13px;font-weight:600;cursor:pointer;}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.excard{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;}
.excard .thumb{width:52px;height:52px;border-radius:10px;background:#f3d4de;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.excard .txt{flex:1;}
.excard .txt h5{margin:0;font-size:14px;}
.excard .txt p{margin:2px 0 0;font-size:11.5px;color:var(--muted);}
.excard .dur{font-size:12px;font-weight:700;color:var(--primary);flex-shrink:0;}
.workout-screen{position:fixed;inset:0;background:#fff;z-index:50;overflow-y:auto;}
.workout-inner{max-width:var(--maxw);margin:0 auto;padding:20px;}
.workout-close{position:absolute;top:16px;right:20px;font-size:22px;cursor:pointer;color:var(--muted);z-index:2;}
.video-wrap{position:relative;margin-bottom:14px;}
.video-box{width:100%;aspect-ratio:1/1;background:#181818;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;color:#666;font-size:40px;object-fit:cover;margin-bottom:0;}
.video-tap{position:absolute;inset:0;background:rgba(0,0,0,.4);border-radius:var(--radius);display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#fff;font-weight:700;font-size:13.5px;cursor:pointer;}
.video-tap .ic{font-size:34px;}
.dots-row{display:flex;gap:5px;margin-bottom:16px;}
.dots-row .dot{flex:1;height:4px;border-radius:3px;background:#eee;}
.dots-row .dot.done{background:var(--green);}
.dots-row .dot.current{background:var(--primary);}
.ex-counter{text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:4px;}
.ex-name{text-align:center;font-weight:700;font-size:19px;margin-bottom:16px;}
.timer-row{display:flex;justify-content:space-between;align-items:flex-end;padding:0 10px;margin-bottom:14px;}
.timer-row .side{text-align:center;}
.timer-row .side .lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;font-weight:700;}
.timer-row .side .v{font-size:15px;font-weight:700;margin-top:2px;}
.timer-big{font-size:52px;font-weight:800;color:var(--primary);text-align:center;font-variant-numeric:tabular-nums;}
.play-btn{width:56px;height:56px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:20px;display:flex;align-items:center;justify-content:center;margin:14px auto 18px;cursor:pointer;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-bottom:24px;}
.nav-row button{flex:1;padding:11px;border-radius:20px;border:1px solid var(--border);background:#f7f7f8;font-family:inherit;font-weight:700;font-size:12.5px;cursor:pointer;}
.upcoming-title{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:10px;}
.rest-badge{background:#fdf3e7;color:var(--orange);text-align:center;padding:6px;border-radius:10px;font-weight:700;font-size:12px;margin-bottom:10px;}
.done-screen{text-align:center;padding-top:40px;}
.done-check{font-size:56px;margin-bottom:10px;}
.done-stats{display:flex;justify-content:center;gap:24px;margin:20px 0;}
.done-stats div{text-align:center;}
.done-stats .v{font-size:22px;font-weight:800;color:var(--primary);}
.done-stats .l{font-size:11px;color:var(--muted);}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:flex;max-width:var(--maxw);margin:0 auto;z-index:20;}
.bottom-nav .item{flex:1;text-align:center;padding:10px 0 8px;cursor:pointer;color:var(--muted);}
.bottom-nav .item.active{color:var(--primary);}
.bottom-nav .item .ic{font-size:19px;display:block;}
.bottom-nav .item .lb{font-size:10.5px;font-weight:600;margin-top:2px;}
.principle-card{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;}
.principle-card .icon{width:38px;height:38px;border-radius:10px;background:#fdeef2;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.principle-card h5{margin:0 0 3px;font-size:14px;}
.principle-card p{margin:0;font-size:12.5px;color:var(--muted);}
.quote-box{background:#fdf3e7;border-radius:12px;padding:16px;font-style:italic;font-size:13.5px;text-align:center;margin-top:6px;}
.quote-box .who{font-style:normal;font-size:11px;color:var(--muted);margin-top:8px;}
.avatar-circle{width:64px;height:64px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;flex-shrink:0;}
.profile-head{display:flex;gap:14px;align-items:center;margin-bottom:20px;}
.profile-head h2{margin:0;font-size:19px;}
.profile-head p{margin:2px 0 0;color:var(--muted);font-size:12.5px;}
.data-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
.data-row:last-of-type{border-bottom:none;}
.data-row .val{font-weight:700;}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#181818;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;}
.toast.show{opacity:1;}
.locked-note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:8px;}
</style>
</head>

  ]

function filterMeals(pool, restricoes){
  const filtered = pool.filter(m => restricoes.every(r => m.tags.includes(r)));
  return filtered.length ? filtered : pool.slice(0,1);
}
function calcCalorieTarget(user){
  const bmr = 10*user.peso_atual_kg + 6.25*user.altura_cm - 5*user.idade - 161;
  const tdee = bmr * 1.375;
  const isLoss = user.peso_meta_kg < user.peso_atual_kg;
  const isGain = user.peso_meta_kg > user.peso_atual_kg;
  let target = isLoss ? tdee - 500 : (isGain ? tdee + 300 : tdee);
  return Math.max(1200, Math.round(target/10)*10);
}
function generateDietPlan(user, restricoes){
  return DIET_DAYS.map((dia,di)=>{
    const refeicoes = DIET_SLOTS.map(slot=>{
      const options = filterMeals(MEAL_POOL[slot.tipo], restricoes);
      const meal = options[di % options.length];
      return {...meal, tipo:slot.tipo, horario:slot.horario};
    });
    const totalKcal = refeicoes.reduce((s,r)=>s+r.kcal,0);
    return {dia, refeicoes, totalKcal};
  });
}

function getExercisesForDay(day){

async function fetchUserByEmail(email){
  const { data, error } = await sb.from('users').select('*').eq('email', email.trim().toLowerCase()).maybeSingle();
  if(error) throw error;
  return data;
}
async function createUser(payload){
  const { data, error } = await sb.from('users').insert(payload).select().single();
  if(error) throw error;
  return data;
}
async function updateUser(id, patch){
  const { data, error } = await sb.from('users').update({...patch, updated_at:new Date().toISOString()}).eq('id', id).select().single();
  if(error) throw error;
  return data;
}

function setScreen(screen, params={}){
  state.screen = screen;

}

async function init(){
  const savedEmail = localStorage.getItem('co_email');
  if(!savedEmail){ setScreen('emailGate'); return; }
  try{
    const user = await fetchUserByEmail(savedEmail);
    if(user){ state.user = user; setScreen('home'); }
    else { localStorage.removeItem('co_email'); setScreen('emailGate'); }
  }catch(e){
    setScreen('emailGate', {error:'Não foi possível conectar. Verifique sua internet e tente novamente.'});
  }
}

function render(){

  nav.style.display = shellScreens.includes(state.screen) ? 'flex' : 'none';

  });
  switch(state.screen){
    case 'loading': main.innerHTML = '<div class="center-screen"><p style="text-align:center;color:var(--muted)">Carregando...</p></div>'; break;

// ---------- Guided Workout ----------
function startWorkout(day){
  workout.day = day;
  workout.exercises = getExercisesForDay(day);
  workout.index = 0;
  workout.phase = 'exercise';
  workout.remaining = EX_SECONDS;
  workout.elapsedTotal = 0;
  workout.calories = 0;
  workout.playing = false;
  clearInterval(workout.handle);
  renderWorkout();
}
function renderWorkout(){
  const main = document.getElementById('mainContainer');
  document.getElementById('bottomNav').style.display='none';
  const ex = workout.exercises[workout.index];
  const total = workout.exercises.length;
  const dots = workout.exercises.map((e,i)=>{
    let cls = '';
    if(i < workout.index) cls='done';
    else if(i === workout.index) cls='current';
    return `<div class="dot ${cls}"></div>`;
  }).join('');
  const upcoming = workout.exercises.slice(workout.index+1, workout.index+4).map(e=>`
    <div class="excard"><div class="thumb">🎥</div><div class="txt"><h5>${e.nome}</h5></div><div class="dur">30s</div></div>
  `).join('');
  const isRest = workout.phase==='rest';
  const nextEx = workout.exercises[workout.index+1];
  const videoHtml = (!isRest && ex.video)
    ? `<div class="video-wrap"><video class="video-box" id="workoutVideo" src="${ex.video}" autoplay loop muted playsinline onerror="videoFallback(this)"></video><div class="video-tap" id="videoTap"><span class="ic">▶</span><span>Toque para reproduzir</span></div></div>`
    : `<div class="video-box">${isRest ? '😌' : '🎥'}</div>`;
  main.innerHTML = `
    <div class="workout-screen">
      <div class="workout-inner">
        <span class="workout-close" id="closeWorkout">✕</span>
        ${videoHtml}
        <div class="dots-row">${dots}</div>
        ${isRest ? `<div class="rest-badge">Descanso — próximo: ${nextEx?nextEx.nome:'Fim'}</div>` : `<div class="ex-counter">Exercício ${workout.index+1} de ${total}</div>`}
        <div class="ex-name">${isRest ? 'Respire e prepare-se' : ex.nome}</div>
        <div class="timer-row">
          <div class="side"><div class="lbl">Decorrido</div><div class="v" id="wElapsed">${fmtTime(workout.elapsedTotal)}</div></div>
          <div class="side"><div class="lbl">Cal</div><div class="v" id="wCal">${Math.round(workout.calories)}</div></div>
        </div>
        <div class="timer-big" id="wRemaining">${fmtTime(workout.remaining)}</div>
        <button class="play-btn" id="playBtn">${workout.playing?'⏸':'▶'}</button>
        <div class="nav-row">
          <button id="prevBtn">‹ ANTERIOR</button>
          <button id="nextBtn">PRÓXIMO ›</button>
        </div>
        ${upcoming ? `<div class="upcoming-title">Próximos exercícios</div>${upcoming}` : ''}
      </div>
    </div>
  `;
  document.getElementById('closeWorkout').addEventListener('click', ()=>{
    clearInterval(workout.handle);
    setScreen('dayDetail', {day: workout.day});
  });
  document.getElementById('playBtn').addEventListener('click', toggleWorkoutPlay);
  document.getElementById('prevBtn').addEventListener('click', ()=> jumpExercise(-1));
  document.getElementById('nextBtn').addEventListener('click', ()=> jumpExercise(1));
  ensureVideoPlays();
}
function ensureVideoPlays(){
  const vid = document.getElementById('workoutVideo');
  const tap = document.getElementById('videoTap');
  if(!vid) return;
  vid.play().catch(()=>{});
  setTimeout(()=>{
    if(tap && (vid.paused || vid.readyState < 2)) tap.style.display='flex';
  }, 2000);
  if(tap) tap.addEventListener('click', ()=>{
    vid.load();
    vid.play().catch(()=>{});
    setTimeout(()=>{ if(vid.readyState >= 2) tap.style.display='none'; }, 400);
  });
}
function toggleWorkoutPlay(){
  workout.playing = !workout.playing;
  const vid = document.querySelector('#mainContainer video');
  if(workout.playing){
    workout.handle = setInterval(workoutTick, 1000);
    if(vid) vid.play().catch(()=>{});
  } else {
    clearInterval(workout.handle);
    if(vid) vid.pause();
  }
  const btn = document.getElementById('playBtn');
  if(btn) btn.textContent = workout.playing ? '⏸' : '▶';
}
function updateWorkoutTimers(){
  const elapsedEl = document.getElementById('wElapsed');
  const calEl = document.getElementById('wCal');
  const remEl = document.getElementById('wRemaining');
  if(elapsedEl) elapsedEl.textContent = fmtTime(workout.elapsedTotal);
  if(calEl) calEl.textContent = Math.round(workout.calories);
  if(remEl) remEl.textContent = fmtTime(workout.remaining);
}
function workoutTick(){
  workout.remaining--;
  workout.elapsedTotal++;
  if(workout.phase==='exercise') workout.calories += 0.12;
  let transitioned = false;
  if(workout.remaining <= 0){
    transitioned = true;
    if(workout.phase==='exercise'){
      if(workout.index >= workout.exercises.length-1){
        clearInterval(workout.handle);
        finishWorkout();
        return;
      }
      workout.phase='rest';
      workout.remaining=REST_SECONDS;
    } else {
      workout.phase='exercise';
      workout.index++;
      workout.remaining=EX_SECONDS;
    }
  }
  if(transitioned) renderWorkout();
  else updateWorkoutTimers();
}
function jumpExercise(dir){
  clearInterval(workout.handle);
  workout.playing=false;
  workout.index = Math.max(0, Math.min(workout.exercises.length-1, workout.index+dir));
  workout.phase='exercise';
  workout.remaining=EX_SECONDS;
  renderWorkout();
}
async function finishWorkout(){
  const day = workout.day;
  const minutes = Math.max(1, Math.round(workout.elapsedTotal/60));
  const kcal = Math.round(workout.calories);
  const u = state.user;
  const newConcluidos = u.dias_concluidos.includes(day) ? u.dias_concluidos : [...u.dias_concluidos, day];
  const newDiaAtual = day === u.dia_atual ? Math.min(day+1, 22) : u.dia_atual;
  try{
    const updated = await updateUser(u.id, {
      dias_concluidos: newConcluidos,
      dia_atual: newDiaAtual,
      tempo_total_min: u.tempo_total_min + minutes
    });
    state.user = updated;
  }catch(e){ /* mantém estado local mesmo se salvar falhar */ }
  const main = document.getElementById('mainContainer');
  main.innerHTML = `
    <div class="workout-screen"><div class="workout-inner">
      <div class="done-screen">
        <div class="done-check">🎉</div>
        <h1 class="page-title" style="text-align:center">Treino concluído!</h1>
        <p class="page-sub" style="text-align:center">Dia ${day} finalizado com sucesso</p>
        <div class="done-stats">
          <div><div class="v">${minutes}</div><div class="l">minutos</div></div>
          <div><div class="v">${kcal}</div><div class="l">kcal</div></div>
          <div><div class="v">${workout.exercises.length}</div><div class="l">exercícios</div></div>
        </div>
        <button class="btn-primary" id="backHomeBtn">Voltar ao Início</button>
      </div>
    </div></div>
  `;
  document.getElementById('backHomeBtn').addEventListener('click', ()=> setScreen('home'));
}

  document.getElementById('backRow').addEventListener('click', ()=> setScreen('perfil'));
  document.getElementById('epSaveBtn').addEventListener('click', async ()=>{
    const nome=document.getElementById('epNome').value.trim();
    const idade=parseInt(document.getElementById('epIdade').value,10);
    const altura=parseFloat(document.getElementById('epAltura').value);
    const peso=parseFloat(document.getElementById('epPeso').value);
    const meta=parseFloat(document.getElementById('epMeta').value);
    const err=document.getElementById('epError');
    const btn=document.getElementById('epSaveBtn');
    if(!nome||!idade||!altura||!peso||!meta){ err.textContent='Preencha todos os campos.'; err.style.display='block'; return; }
    btn.disabled=true; btn.textContent='Salvando...';
    try{
      const updated = await updateUser(state.user.id, {nome, idade, altura_cm:altura, peso_atual_kg:peso, peso_meta_kg:meta});
      state.user = updated;
      setScreen('perfil');
    }catch(e){

      btn.disabled=false; btn.textContent='Salvar';
    }
  });
}

// ---------- Dieta ----------
function tplDieta(){
  const u = state.user;
  if(u.dieta && u.dieta.length && !state.dietaEditing) return tplDietaPlano();
  return tplDietaSetup();
}
function tplDietaSetup(){
  const chipsHtml = DIET_RESTRICTIONS.map(r=>{
    const active = state.dietSelRestricoes.includes(r);
    return `<div class="chip ${active?'active':''}" data-r="${r}">${r}</div>`;
  }).join('');
  return `
    <h1 class="page-title">Dieta Personalizada</h1>
    <p class="page-sub">Alimentação ajustada aos seus objetivos</p>
    <div class="tip-box">💡 Sua meta calórica é calculada com base na idade, altura, peso atual e peso meta do seu perfil.</div>
    <h3 style="font-size:15px;margin:0 0 10px;">Restrições alimentares (opcional)</h3>
    <div class="chip-row">${chipsHtml}</div>
    <div class="field"><label>Prazo desejado (dias)</label><input type="text" inputmode="numeric" id="dietPrazo" value="${state.user.prazo_dieta||60}"></div>
    <button class="btn-primary" id="genDietBtn">✨ Gerar Dieta Personalizada</button>
  `;
}
function tplDietaPlano(){
  const u = state.user;
  const dayIdx = state.dietSelectedDay || 0;
  const dayPlan = u.dieta[dayIdx];
  const dayTabs = u.dieta.map((d,i)=>`<button class="pill-btn ${i===dayIdx?'primary':'ghost'}" data-day="${i}" style="flex-shrink:0;">${d.dia.split('-')[0].slice(0,3)}</button>`).join('');
  const mealsHtml = dayPlan.refeicoes.map(r=>`
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
        <div><h4 style="margin:0 0 2px;font-size:14.5px;">${r.nome}</h4><p style="margin:0;color:var(--muted);font-size:12px;">${r.tipo} · ${r.horario}</p></div>
        <div style="color:var(--primary);font-weight:700;font-size:13px;white-space:nowrap;">${r.kcal} kcal</div>
      </div>
      <div style="margin-top:10px;font-size:12.5px;color:var(--muted);">${r.ingredientes.join(' · ')}</div>
    </div>
  `).join('');
  return `
    <h1 class="page-title">Dieta Personalizada</h1>
    <p class="page-sub">Plano de 7 dias baseado no seu perfil</p>
    <div class="shortcut" id="scReceitas" style="margin-bottom:14px;"><div class="icon">📖</div><div class="txt"><h4>Receitas</h4><p>Pratos saudáveis e fáceis</p></div><span class="arrow">›</span></div>
    <div class="today-card">
      <div class="eyebrow">Meta de calorias diárias</div>
      <h3 style="font-size:28px;margin:6px 0 0;">${calcCalorieTarget(u)} kcal/dia</h3>
    </div>
    <div style="display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px;">${dayTabs}</div>
    <div style="font-weight:700;margin-bottom:10px;">${dayPlan.dia} · ${dayPlan.totalKcal} kcal no dia</div>
    ${mealsHtml}
    <button class="btn-secondary" id="regenDietBtn" style="margin-top:14px;">Ajustar restrições / Gerar novamente</button>
  `;
}
function attachDieta(){
  if(state.user.dieta && state.user.dieta.length && !state.dietaEditing){
    document.getElementById('scReceitas').addEventListener('click', ()=> setScreen('receitas'));
    document.querySelectorAll('[data-day]').forEach(el=>{
      el.addEventListener('click', ()=>{ state.dietSelectedDay = parseInt(el.dataset.day,10); render(); });
    });
    document.getElementById('regenDietBtn').addEventListener('click', ()=>{
      state.dietSelRestricoes = state.user.restricoes || [];
      state.dietaEditing = true;
      render();
    });
  } else {
    document.querySelectorAll('[data-r]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const r = el.dataset.r;
        const idx = state.dietSelRestricoes.indexOf(r);
        if(idx>-1) state.dietSelRestricoes.splice(idx,1); else state.dietSelRestricoes.push(r);
        render();
      });
    });
    document.getElementById('genDietBtn').addEventListener('click', async ()=>{
      const prazo = parseInt(document.getElementById('dietPrazo').value,10) || 60;
      const btn = document.getElementById('genDietBtn');
      btn.disabled = true; btn.textContent = 'Gerando...';
      const plan = generateDietPlan(state.user, state.dietSelRestricoes);
      try{
        const updated = await updateUser(state.user.id, {dieta: plan, restricoes: state.dietSelRestricoes, prazo_dieta: prazo});
        state.user = updated;
        state.dietaEditing = false;
        state.dietSelectedDay = 0;
        render();
      }catch(e){
        showToast('Não foi possível gerar a dieta. Tente novamente.');
        btn.disabled = false; btn.textContent = '✨ Gerar Dieta Personalizada';
      }
    });
  }
}
